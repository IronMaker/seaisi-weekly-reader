name: SEAISI Weekly Cloud Autorun

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 3'
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly_autorun.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: seaisi-weekly-cloud-autorun
  cancel-in-progress: false

jobs:
  weekly:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test
        run: |
          python -m pytest -q
          python -m compileall src

      - name: Run SEAISI acquisition
        id: acquisition
        run: |
          set -euo pipefail
          python -m seaisi_weekly_reader.workflow | tee weekly_stdout.json
          ARTIFACT_DIR=$(python - <<'PY'
          import json
          from pathlib import Path
          line = Path('weekly_stdout.json').read_text(encoding='utf-8').strip().splitlines()[-1]
          payload = json.loads(line)
          print(payload['artifact_dir'])
          PY
          )
          test -d "$ARTIFACT_DIR"
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build publication page
        id: publish
        run: |
          set -euo pipefail
          python -m seaisi_weekly_reader.cloud_publish "${{ steps.acquisition.outputs.artifact_dir }}" | tee publish_stdout.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          line = Path('publish_stdout.json').read_text(encoding='utf-8').strip().splitlines()[-1]
          p = json.loads(line)
          with open(Path(os.environ['GITHUB_OUTPUT']), 'a', encoding='utf-8') as f:
              for k in ('start','end','status','published'):
                  f.write(f'{k}={p[k]}\n')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: seaisi-weekly-evidence-${{ steps.publish.outputs.start }}_${{ steps.publish.outputs.end }}
          path: ${{ steps.acquisition.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit publication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Publish SEAISI weekly ${{ steps.publish.outputs.start }} to ${{ steps.publish.outputs.end }}"
            git push origin HEAD:main
          else
            echo 'No publication changes to commit.'
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Optional email delivery
        env:
          SMTP_HOST: ${{ secrets.SEAISI_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SEAISI_SMTP_PORT }}
          SMTP_USER: ${{ secrets.SEAISI_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SEAISI_SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.SEAISI_EMAIL_TO }}
          START_DATE: ${{ steps.publish.outputs.start }}
          END_DATE: ${{ steps.publish.outputs.end }}
          PUB_STATUS: ${{ steps.publish.outputs.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          required = ['SMTP_HOST','SMTP_USER','SMTP_PASSWORD','EMAIL_TO']
          if any(not os.getenv(x) for x in required):
              print('EMAIL_SKIPPED: GitHub email secrets are not configured.')
              raise SystemExit(0)
          port = int(os.getenv('SMTP_PORT') or '587')
          msg = EmailMessage()
          msg['Subject'] = f"SEAISI 週報｜{os.environ['START_DATE']}–{os.environ['END_DATE']}"
          msg['From'] = os.environ['SMTP_USER']
          msg['To'] = os.environ['EMAIL_TO']
          msg.set_content(
              f"SEAISI Weekly Cloud Autorun completed.\n"
              f"Status: {os.environ['PUB_STATUS']}\n"
              f"Period: {os.environ['START_DATE']}–{os.environ['END_DATE']}\n"
              f"Web: {os.environ.get('PAGE_URL','')}latest.html\n"
          )
          with smtplib.SMTP(os.environ['SMTP_HOST'], port, timeout=30) as s:
              s.starttls()
              s.login(os.environ['SMTP_USER'], os.environ['SMTP_PASSWORD'])
              s.send_message(msg)
          print('EMAIL_SENT')
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo '## SEAISI Weekly Cloud Autorun'
            echo ''
            echo '- Schedule: Wednesday 09:00 Asia/Taipei (01:00 UTC)'
            echo '- Period: `${{ steps.publish.outputs.start }} → ${{ steps.publish.outputs.end }}`'
            echo '- Publication status: `${{ steps.publish.outputs.status }}`'
            echo '- Pages: ${{ steps.deployment.outputs.page_url }}'
            echo '- Latest: ${{ steps.deployment.outputs.page_url }}latest.html'
            echo '- Email: sent only when SEAISI_SMTP_* and SEAISI_EMAIL_TO secrets are configured.'
          } >> "$GITHUB_STEP_SUMMARY"

